  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.15" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="0.85" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="gradN" x1="0" y1="0" x2="748" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#21262d"/></pattern>
    <radialGradient id="fade"><stop offset="0.2" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1000" height="300" fill="url(#fade)"/></mask>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ln,.tr,.flow,.ul { fill:none; stroke:url(#grad); stroke-linecap:round; stroke-linejoin:round; }
    .ln  { stroke:url(#gradN); stroke-width:4.6; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .75s cubic-bezier(.6,0,.3,1) forwards; }
    .tr  { stroke-width:2; opacity:.55; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s ease-out forwards; }
    .ul  { stroke-width:2.4; stroke-dasharray:1; stroke-dashoffset:1; animation:draw .9s ease-out 2.56s forwards; }
    .flow{ stroke-width:3; stroke-dasharray:.12 .88; stroke-dashoffset:1; opacity:0; animation:flow 2.8s linear infinite; }
    .dot,.node { fill:url(#gradN); opacity:0; animation:pop .4s ease-out forwards; }
    .node{ fill:#0d1117; stroke:url(#grad); stroke-width:2; }
    .fade{ opacity:0; animation:fade .8s ease-out forwards; }
    .sub { font:600 22px 'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; letter-spacing:9px; fill:#8b949e; }
    .term{ font:16px ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace; fill:#c9d1d9; }
    .term .p{ fill:#58a6ff; }
    .term .s{ fill:#f778ba; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes flow { 0% { stroke-dashoffset:1; opacity:0; } 10% { opacity:1; } 70% { opacity:1; } 100% { stroke-dashoffset:-.1; opacity:0; } }
    @keyframes pop  { from { opacity:0; } to { opacity:1; } }
    @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) {
      .ln,.tr,.ul { animation:none; stroke-dashoffset:0; } .dot,.node,.fade { animation:none; opacity:1; } .flow { display:none; }
    }
  </style>

